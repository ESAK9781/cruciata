[package]
name = "cruciata"
version.workspace = true
edition.workspace = true

[dependencies]
cruciata-core = { path = "../core" }
cruciata-net = { path = "../net" }
serde_json = "1"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
