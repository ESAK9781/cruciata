name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main, master, realism]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out realism comparison
        uses: actions/checkout@v4
        with:
          ref: realism
          path: realism-source
      - name: Set up Node for static build
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Check realism source
        run: npm --prefix realism-source run check
      - name: Build static files
        run: npm run build
      - name: Build realism comparison
        run: |
          node realism-source/scripts/build-static.js
          cp -R realism-source/dist dist/realism
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
